<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Editor de notas Markdown</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
            <h1>Editor de notas Markdown</h1>

    <div class="contenedor">
        <div class="secciones" >
            <h2>Mis Notas</h2>
            <div class="secciones-notas">
            <button class="btn" id="btnNuevaNota">Nueva Nota</button>
            <button class="btn" id="btnEliminarNota">Eliminar Nota  </button>
            <button class="btn" id="btnExportarNota">Exportar Nota</button>
            </div>
        </div>
        <div class="secciones" >

            <div class="secciones-editor">
           <h2>Notas Editor</h2>
            <button class="btnGuardar" id="btnGuardarNota">Guardar Nota</button>
          </div>
              <div class="contenido">
                <div class="secciones-notas"><h3>Título:</h3><textarea id="editorNotasNombre" placeholder="Nota 1..."></textarea></div>
                  
                <textarea id="editorNotas" placeholder="Escribe tu nota aquí...">

                </textarea>
              </div>
        
        </div>
      
        <div class="secciones">
            <h2>Notas preview</h2>
            <div class="contenido"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
